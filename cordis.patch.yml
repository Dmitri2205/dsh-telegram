- insert:
    - id: telegram-bot
      name: '@local/dsh-telegram'
      config:
        # Токен задаётся в настройках плагина (Settings → Telegram Bot) и хранится
        # в ~/.dsh/telegram-settings.json. Плейсхолдеры ${ENV} загрузчик не раскрывает.
        mode: webhook
        allowedChatIds: []
        webhookSecret: ''
        maxFileSize: 10485760
